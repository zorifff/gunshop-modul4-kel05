<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Background -->
  <rect width="240" height="180" fill="#f4f1ec"/>

  <!-- Barrel -->
  <rect x="14" y="82" width="148" height="10" rx="3" fill="#1a1a1a"/>
  <!-- Muzzle brake -->
  <rect x="8" y="79" width="12" height="16" rx="2" fill="#2c2c2c"/>
  <line x1="11" y1="82" x2="11" y2="92" stroke="#444" stroke-width="1.5"/>
  <line x1="14" y1="82" x2="14" y2="92" stroke="#444" stroke-width="1.5"/>
  <!-- Gas block / front sight -->
  <rect x="60" y="76" width="14" height="18" rx="2" fill="#333"/>
  <rect x="65" y="72" width="4" height="8" rx="1" fill="#555"/>
  <!-- Upper receiver -->
  <rect x="120" y="74" width="60" height="24" rx="3" fill="#2c2c2c"/>
  <!-- Carry handle / rear sight -->
  <rect x="148" y="66" width="28" height="12" rx="3" fill="#3a3a3a"/>
  <rect x="158" y="62" width="8" height="6" rx="1" fill="#555"/>
  <!-- Charging handle -->
  <rect x="176" y="72" width="6" height="10" rx="2" fill="#888"/>

  <!-- Lower receiver -->
  <path d="M120 98 L180 98 L180 112 L120 112 Z" fill="#3a3a3a"/>
  <!-- Trigger guard -->
  <path d="M128 98 Q112 98 112 114 Q112 130 128 130 L148 130 L148 98 Z" fill="#3a3a3a"/>
  <!-- Trigger -->
  <path d="M132 104 L128 124 L135 124 L137 104 Z" fill="#888"/>
  <!-- Pistol grip -->
  <path d="M168 98 L180 98 L184 130 L162 130 Z" rx="4" fill="#222"/>
  <line x1="166" y1="108" x2="182" y2="108" stroke="#444" stroke-width="1.5"/>
  <line x1="166" y1="116" x2="182" y2="116" stroke="#444" stroke-width="1.5"/>
  <line x1="166" y1="124" x2="182" y2="124" stroke="#444" stroke-width="1.5"/>
  <!-- Magazine -->
  <path d="M138 112 L150 112 L154 148 L134 148 Z" fill="#1a1a1a"/>
  <line x1="136" y1="124" x2="152" y2="124" stroke="#333" stroke-width="1.5"/>
  <line x1="136" y1="136" x2="152" y2="136" stroke="#333" stroke-width="1.5"/>
  <!-- Stock -->
  <path d="M180 80 L224 88 L224 106 L180 112 Z" fill="#5c3d1e"/>
  <line x1="190" y1="82" x2="190" y2="110" stroke="#7a5230" stroke-width="1.5"/>
  <line x1="202" y1="84" x2="202" y2="109" stroke="#7a5230" stroke-width="1.5"/>
  <line x1="214" y1="86" x2="214" y2="107" stroke="#7a5230" stroke-width="1.5"/>
  <!-- Butt plate -->
  <rect x="220" y="84" width="6" height="26" rx="2" fill="#2c2c2c"/>
  <!-- Handguard -->
  <rect x="22" y="80" width="100" height="14" rx="3" fill="#333"/>
  <line x1="40" y1="80" x2="40" y2="94" stroke="#444" stroke-width="1"/>
  <line x1="58" y1="80" x2="58" y2="94" stroke="#444" stroke-width="1"/>
  <line x1="76" y1="80" x2="76" y2="94" stroke="#444" stroke-width="1"/>
  <line x1="94" y1="80" x2="94" y2="94" stroke="#444" stroke-width="1"/>
  <line x1="112" y1="80" x2="112" y2="94" stroke="#444" stroke-width="1"/>
</svg>

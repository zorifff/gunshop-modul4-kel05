<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <!-- Background -->
  <rect width="240" height="180" fill="#f4f1ec"/>

  <!-- Barrel (tube) -->
  <rect x="12" y="80" width="155" height="12" rx="4" fill="#1a1a1a"/>
  <!-- Muzzle end -->
  <rect x="8" y="77" width="8" height="18" rx="3" fill="#2c2c2c"/>
  <!-- Magazine tube under barrel -->
  <rect x="12" y="96" width="120" height="9" rx="3" fill="#2a2a2a"/>

  <!-- Front bead sight -->
  <circle cx="22" cy="80" r="3" fill="#c8a84b"/>

  <!-- Receiver -->
  <rect x="148" y="72" width="44" height="34" rx="4" fill="#2c2c2c"/>
  <!-- Ejection port -->
  <rect x="152" y="76" width="20" height="12" rx="2" fill="#1a1a1a"/>
  <!-- Action bars -->
  <rect x="132" y="96" width="20" height="6" rx="2" fill="#555"/>

  <!-- Trigger guard -->
  <path d="M148 106 Q132 106 132 120 Q132 136 148 136 L168 136 L168 106 Z" fill="#3a3a3a"/>
  <!-- Trigger -->
  <path d="M152 110 L148 130 L155 130 L157 110 Z" fill="#888"/>

  <!-- Pump forestock -->
  <rect x="60" y="96" width="56" height="16" rx="5" fill="#7a5230"/>
  <line x1="72" y1="98" x2="72" y2="110" stroke="#9a6840" stroke-width="1.5"/>
  <line x1="84" y1="98" x2="84" y2="110" stroke="#9a6840" stroke-width="1.5"/>
  <line x1="96" y1="98" x2="96" y2="110" stroke="#9a6840" stroke-width="1.5"/>
  <line x1="108" y1="98" x2="108" y2="110" stroke="#9a6840" stroke-width="1.5"/>

  <!-- Pistol grip / wrist -->
  <path d="M168 106 L192 106 L196 136 L162 136 Z" fill="#5c3d1e"/>
  <line x1="168" y1="116" x2="192" y2="116" stroke="#7a5230" stroke-width="1.5"/>
  <line x1="168" y1="126" x2="192" y2="126" stroke="#7a5230" stroke-width="1.5"/>

  <!-- Stock -->
  <path d="M192 76 L232 84 L232 112 L192 112 Z" fill="#7a5230"/>
  <line x1="202" y1="78" x2="202" y2="110" stroke="#9a6840" stroke-width="1.5"/>
  <line x1="214" y1="80" x2="214" y2="110" stroke="#9a6840" stroke-width="1.5"/>
  <line x1="226" y1="82" x2="226" y2="110" stroke="#9a6840" stroke-width="1.5"/>
  <!-- Butt plate -->
  <rect x="228" y="80" width="6" height="34" rx="2" fill="#2c2c2c"/>

  <!-- Rib on top of barrel -->
  <rect x="12" y="77" width="155" height="4" rx="2" fill="#333"/>
</svg>
